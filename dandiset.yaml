description: "Neuropixels 1.0 recordings from medial prefrontal cortex in seven anesthetized
  Sprague-Dawley rats (3 LSD, 4 saline), 24 hours after administration of 0.2 mg/kg
  LSD or saline (vehicle). During recording, electrical stimulation was delivered
  to the basolateral amygdala (BLA). Raw electrophysiology (AP 30 kHz, LFP 2.5 kHz)
  and NIDQ auxiliary channels with stimulation triggers are provided per subject under
  sourcedata/ as NWB, with BIDS/BEP032 sidecars (probe, channels, electrodes, coordinate
  system). Kilosort4 spike sorting and bombcell quality metrics are provided as derivatives
  for subject NP06.\n\nElectrode coordinates use the Paxinos & Watson atlas in standard
  stereotaxic convention (mm; AP and ML relative to bregma, DV relative to brain surface):
  x = anterior-posterior (anterior positive), y = medial-lateral (right positive),
  z = dorsal-ventral (dorsal positive, ventral negative). Probe insertion: AP +3.4
  mm, ML 0.75 mm (left hemisphere), DV -6.0 mm (probe tip), perpendicular (0 deg).
  BLA stimulation site: AP -1.7, ML 4.5, DV -7.5 mm."
